name: Gemini Lecture Codes Assistant

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'lecturecodes.md'

permissions:
  contents: write

jobs:
  gemini-reply:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Gemini Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python .github/scripts/gemini_bot.py

      - name: Commit & Push Updated lecturecodes.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lecturecodes.md
          if git diff --staged --quiet; then
            echo "No changes detected in lecturecodes.md"
          else
            git commit -m "🤖 [Gemini AI] Code & Response Update [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
