name: Gemini Commit Reviewer & Assistant

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'response.md'
      - 'chat_history.md'
      - '.github/**'

permissions:
  contents: write

jobs:
  gemini-response:
    # github-actions[bot] tarafından atılan veya [skip ci] içeren commitleri işleme almayarak sonsuz döngüyü engeller
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çek (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python Ortamını Hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gemini Botunu Çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python .github/scripts/gemini_bot.py

      - name: Yanıtı Geri Commit ve Push Et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add response.md chat_history.md
          if git diff --staged --quiet; then
            echo "Herhangi bir değişiklik yok, commit atlanıyor."
          else
            git commit -m "🤖 [Gemini AI] Otomatik Yanıt [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
